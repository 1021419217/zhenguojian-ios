name: Build iOS IPA

# 精简工作流：只跑 iOS 一个 job，跳过 checks / android / windows / web / macOS。
# 基线 = wokaotianshi123/guoappxp@master（1.6.0+123）。
# 注意：外置站源仓库 guoapp-sources 为上游私有仓库（需 SOURCES_DEPLOY_KEY），
# 本工作流不检出它，因此构建命令不带 --sources，产物为「core 内置源」版：
# 红果 / 番茄 / 黄果 / 听书 / 自定义源可用，外置站源（A123、鬼片、爱看机器人等）不含。

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  PYTHONIOENCODING: utf-8

jobs:
  ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      # 直接检出上游公开仓库 master：无需同步源码，永远跟随上游最新版。
      - uses: actions/checkout@v4
        with:
          repository: wokaotianshi123/guoappxp
          ref: master

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Check Xcode / CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --find clang
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version
          go version
          flutter --version
          flutter precache --ios

      - name: Flutter pub get
        run: flutter pub get --enforce-lockfile

      # 番茄引擎静态库：失败不拦出包（FanqieEngine.podspec 会跳过链接，
      # 应用照常能装，只是番茄源提示引擎未就绪）。
      - name: Build Fanqie engine static lib (iOS)
        continue-on-error: true
        run: |
          rustup target add aarch64-apple-ios
          python scripts/build_fanqie_engine.py --out ios/FanqieEngine --target aarch64-apple-ios

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ios/Podfile', '.flutter-plugins-dependencies') }}
          restore-keys: |
            pods-${{ runner.os }}-${{ runner.arch }}-

      # 关键一步：Go 核心 xcframework -> pod install ->
      # flutter build ios --release --no-codesign -> 打包未签名 IPA。
      # --all-sources = 真果鉴（core 内置全部站源），不带 --sources（私有外置源不可用）。
      - name: Build unsigned IPA
        run: python scripts/build_ios.py --all-sources

      - name: 列出产物
        run: ls -lh dist/ios/

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14
